<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planering">
<title>Min Planering</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#fff;--bg2:#f5f5f7;--bg3:#ebebed;
--text:#1a1a1e;--text2:#6e6e73;--text3:#aeaeb2;
--accent:#534AB7;--accent2:#1D9E75;--accent3:#E24B4A;
--border:rgba(0,0,0,0.1);--card:#fff;
--safe-top:env(safe-area-inset-top,0px);
--safe-bot:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;--border:rgba(255,255,255,0.1);--card:#2c2c2e}
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:430px;margin:0 auto}
.statusbar{height:var(--safe-top);background:var(--bg)}
.header{padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.header-date{font-size:13px;color:var(--text2);margin-top:2px}
.content{flex:1;padding:0 16px;padding-bottom:calc(140px + var(--safe-bot));overflow-y:auto}
.panel{display:none}
.panel.active{display:block}
.section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;margin:20px 0 10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:0.5px solid var(--border)}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border)}
.card-row:last-child{border-bottom:none;padding-bottom:0}
.card-row:first-child{padding-top:0}
.event-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.event-dot.work{background:#534AB7}
.event-dot.gym{background:#1D9E75}
.event-dot.personal{background:#E24B4A}
.event-info p{font-size:15px;font-weight:500;color:var(--text)}
.event-info span{font-size:12px;color:var(--text2)}
.event-left{display:flex;align-items:center;gap:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-hdr{text-align:center;font-size:11px;color:var(--text3);padding:4px 0;font-weight:500}
.cal-day{text-align:center;padding:6px 2px;border-radius:8px;font-size:14px;color:var(--text2);cursor:pointer;position:relative}
.cal-day.today{background:var(--accent);color:#fff;font-weight:600}
.cal-day.selected:not(.today){background:var(--bg2);color:var(--text);font-weight:600}
.cal-day.has-ev::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent2);position:absolute;bottom:1px;left:50%;transform:translateX(-50%)}
.cal-day.today.has-ev::after{background:#9FE1CB}
.cal-day.other{opacity:0.3}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav span{font-size:16px;font-weight:600}
.cal-nav button{background:var(--bg2);border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--text)}
.stock-change{font-size:13px;font-weight:500}
.stock-change.up{color:#1D9E75}
.stock-change.down{color:#E24B4A}
.stock-name{font-size:15px;font-weight:500}
.stock-ticker{font-size:12px;color:var(--text2)}
.stock-price{font-size:15px;font-weight:500;text-align:right}
.goal-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid var(--border)}
.goal-item:last-child{border-bottom:none;padding-bottom:0}
.goal-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;transition:all 0.2s}
.goal-check.done{background:var(--accent2);border-color:var(--accent2);color:#fff}
.goal-text{font-size:15px;color:var(--text);flex:1}
.goal-text.done{text-decoration:line-through;color:var(--text2)}
.goal-badge{font-size:11px;padding:3px 8px;border-radius:10px;flex-shrink:0}
.goal-badge.short{background:#EEEDFE;color:#534AB7}
.goal-badge.long{background:#E1F5EE;color:#0F6E56}
.add-form{background:var(--bg2);border-radius:16px;padding:14px;margin-bottom:12px}
.add-form input,.add-form select{width:100%;font-size:15px;padding:10px 12px;border-radius:10px;border:0.5px solid var(--border);background:var(--card);color:var(--text);margin-bottom:8px;outline:none;-webkit-appearance:none;appearance:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-row input,.form-row select{margin-bottom:0}
.btn-add{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-add.green{background:var(--accent2)}
.mail-item{padding:12px 0;border-bottom:0.5px solid var(--border)}
.mail-item:last-child{border-bottom:none;padding-bottom:0}
.mail-sender{font-size:13px;color:var(--text2);margin-bottom:2px}
.mail-subject{font-size:15px;font-weight:500;color:var(--text)}
.mail-preview{font-size:13px;color:var(--text2);margin-top:3px}
.mail-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.mail-time{font-size:12px;color:var(--text3)}
.filter-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:10px;background:#E1F5EE;color:#0F6E56;margin-bottom:12px}
.briefing-card{background:linear-gradient(135deg,#534AB7 0%,#1D9E75 100%);border-radius:20px;padding:20px;color:#fff;margin-bottom:16px}
.briefing-card h2{font-size:22px;font-weight:700;margin-bottom:4px}
.briefing-card p{font-size:14px;opacity:0.85}
.brief-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.brief-stat{background:rgba(255,255,255,0.2);border-radius:12px;padding:10px 12px}
.brief-stat-val{font-size:24px;font-weight:700}
.brief-stat-lbl{font-size:12px;opacity:0.85;margin-top:2px}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bg);border-top:0.5px solid var(--border);display:flex;padding-bottom:calc(var(--safe-bot) + 50px);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;cursor:pointer;gap:3px;min-height:60px}
.nav-item span{font-size:10px;color:var(--text2)}
.nav-item svg{width:24px;height:24px;stroke:var(--text2);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active svg{stroke:var(--accent)}
.nav-item.active span{color:var(--accent)}
.empty{text-align:center;padding:24px 0;color:var(--text2);font-size:14px}
.del-btn{color:var(--text3);font-size:22px;cursor:pointer;padding-left:10px;line-height:1}
</style>
</head>
<body>
<div class="app">
<div class="statusbar"></div>

<!-- HEM -->
<div id="panel-hem" class="panel active">
  <div class="header">
    <div>
      <div class="header-title">God morgon 👋</div>
      <div class="header-date" id="hem-date"></div>
    </div>
  </div>
  <div class="content">
    <div class="briefing-card">
      <h2>Dagens översikt</h2>
      <p id="brief-subtitle"></p>
      <div class="brief-stats">
        <div class="brief-stat"><div class="brief-stat-val" id="brief-events">0</div><div class="brief-stat-lbl">Händelser idag</div></div>
        <div class="brief-stat"><div class="brief-stat-val" id="brief-goals">0</div><div class="brief-stat-lbl">Aktiva mål</div></div>
      </div>
    </div>
    <div class="section-title">Idag</div>
    <div class="card" id="hem-events-card"></div>
    <div class="section-title">Börsen</div>
    <div class="card" id="hem-stocks"></div>
  </div>
</div>

<!-- KALENDER -->
<div id="panel-kalender" class="panel">
  <div class="header"><div class="header-title">Kalender</div></div>
  <div class="content">
    <div class="card">
      <div class="cal-nav">
        <button onclick="prevMonth()">‹</button>
        <span id="cal-label"></span>
        <button onclick="nextMonth()">›</button>
      </div>
      <div class="cal-grid" id="cal-headers"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="section-title" id="sel-day-label">Välj ett datum</div>
    <div id="day-events"></div>
    <div class="section-title">Lägg till händelse</div>
    <div class="add-form">
      <input type="text" id="ev-title" placeholder="Titel, t.ex. Löpning 5 km">
      <div class="form-row">
        <input type="time" id="ev-time" value="07:00">
        <select id="ev-type">
          <option value="work">💼 Arbete</option>
          <option value="gym">🏋️ Träning</option>
          <option value="personal">📌 Personligt</option>
        </select>
      </div>
      <button class="btn-add" onclick="addEvent()">Lägg till</button>
    </div>
  </div>
</div>

<!-- BÖRS -->
<div id="panel-bors" class="panel">
  <div class="header"><div class="header-title">Börs</div></div>
  <div class="content">
    <div class="section-title">Marknadsöversikt</div>
    <div class="card" id="stocks-full"></div>
    <p style="font-size:12px;color:var(--text2);text-align:center;margin-top:8px">Uppdateras varje gång du öppnar appen</p>
  </div>
</div>

<!-- MAIL -->
<div id="panel-mail" class="panel">
  <div class="header"><div class="header-title">Mail</div></div>
  <div class="content">
    <div class="filter-pill">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Reklam filtreras automatiskt
    </div>
    <div class="card" id="mail-list"></div>
    <div class="add-form" style="margin-top:12px">
      <input type="text" id="mail-from" placeholder="Från">
      <input type="text" id="mail-subject" placeholder="Ämne">
      <input type="text" id="mail-preview" placeholder="Förhandsgranskning">
      <button class="btn-add" onclick="addMail()">Lägg till mail</button>
    </div>
  </div>
</div>

<!-- MÅL -->
<div id="panel-mal" class="panel">
  <div class="header"><div class="header-title">Mål</div></div>
  <div class="content">
    <div class="section-title">📅 Kortsiktiga mål</div>
    <div class="card" id="short-goals-list"></div>
    <div class="section-title">🎯 Långsiktiga mål</div>
    <div class="card" id="long-goals-list"></div>
    <div class="section-title">Lägg till mål</div>
    <div class="add-form">
      <input type="text" id="goal-title" placeholder="Beskriv ditt mål...">
      <select id="goal-type">
        <option value="short">📅 Kortsiktigt (veckor)</option>
        <option value="long">🎯 Långsiktigt (månader/år)</option>
      </select>
      <button class="btn-add green" onclick="addGoal()">Lägg till mål</button>
    </div>
  </div>
</div>

<!-- NAVBAR -->
<nav class="bottomnav">
  <div class="nav-item active" id="nav-hem" onclick="showPanel('hem',this)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Hem</span>
  </div>
  <div class="nav-item" id="nav-kalender" onclick="showPanel('kalender',this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Kalender</span>
  </div>
  <div class="nav-item" id="nav-bors" onclick="showPanel('bors',this)">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span>Börs</span>
  </div>
  <div class="nav-item" id="nav-mail" onclick="showPanel('mail',this)">
    <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    <span>Mail</span>
  </div>
  <div class="nav-item" id="nav-mal" onclick="showPanel('mal',this)">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    <span>Mål</span>
  </div>
</nav>
</div>

<script>
const MONTHS=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];
const DAYS=['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

let events=load('pln_events',[]);
let goals=load('pln_goals',[
  {id:uid(),title:'Träna 3 gånger denna vecka',type:'short',done:false},
  {id:uid(),title:'Springa ett maraton',type:'long',done:false},
]);
let mails=load('pln_mails',[
  {id:uid(),from:'Anna Lindström',subject:'Möte imorgon kl 10',preview:'Kan du bekräfta att mötet imorgon kl 10 är OK?',time:'08:42'},
  {id:uid(),from:'Erik Persson',subject:'Rapport Q2 klar att granska',preview:'Bifogat hittar du Q2-rapporten, vänligen granska den.',time:'Igår'},
]);

let stocks=[
  {name:'OMX Stockholm 30',ticker:'OMXS30',price:2341,change:0.8},
  {name:'Ericsson',ticker:'ERIC B',price:76.20,change:1.2},
  {name:'Volvo B',ticker:'VOLV B',price:281.40,change:-0.4},
  {name:'H&M B',ticker:'HM B',price:143.85,change:2.1},
  {name:'SEB A',ticker:'SEB A',price:158.30,change:0.6},
  {name:'S&P 500',ticker:'SPX',price:5482,change:0.3},
  {name:'Dow Jones',ticker:'DJI',price:38652,change:-0.1},
];

let viewYear=new Date().getFullYear(),viewMonth=new Date().getMonth();
let selDay=new Date().getDate(),selMonth=viewMonth,selYear=viewYear;

function todayKey(){const d=new Date();return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function dayKey(y,m,d){return y+'-'+m+'-'+d}

function showPanel(id,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='hem')renderHem();
  else if(id==='kalender')renderCal();
  else if(id==='bors')renderStocks();
  else if(id==='mail')renderMail();
  else if(id==='mal')renderGoals();
}

function renderHem(){
  const now=new Date();
  const days=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
  document.getElementById('hem-date').textContent=days[now.getDay()]+' '+now.getDate()+' '+MONTHS[now.getMonth()].toLowerCase()+' '+now.getFullYear();
  const todayEvs=events.filter(e=>e.date===todayKey());
  const active=goals.filter(g=>!g.done).length;
  document.getElementById('brief-events').textContent=todayEvs.length;
  document.getElementById('brief-goals').textContent=active;
  document.getElementById('brief-subtitle').textContent=todayEvs.length+' händelser idag · '+active+' aktiva mål';
  const ec=document.getElementById('hem-events-card');
  ec.innerHTML=todayEvs.length?todayEvs.map(e=>'<div class="card-row"><div class="event-left"><div class="event-dot '+e.type+'"></div><div class="event-info"><p>'+e.title+'</p><span>'+(e.time||'')+'&nbsp;·&nbsp;'+(e.type==='work'?'Arbete':e.type==='gym'?'Träning':'Personligt')+'</span></div></div></div>').join(''):'<div class="empty">Inga händelser idag</div>';
  document.getElementById('hem-stocks').innerHTML=stocks.slice(0,4).map(s=>'<div class="card-row"><div><div class="stock-name">'+s.name+'</div><div class="stock-ticker">'+s.ticker+'</div></div><div style="text-align:right"><div class="stock-price">'+s.price.toLocaleString('sv-SE')+'</div><div class="stock-change '+(s.change>=0?'up':'down')+'">'+(s.change>=0?'▲':'▼')+' '+Math.abs(s.change).toFixed(1)+'%</div></div></div>').join('');
}

function renderCal(){
  document.getElementById('cal-headers').innerHTML=DAYS.map(d=>'<div class="cal-hdr">'+d+'</div>').join('');
  document.getElementById('cal-label').textContent=MONTHS[viewMonth]+' '+viewYear;
  const first=new Date(viewYear,viewMonth,1);
  let start=first.getDay()-1;if(start<0)start=6;
  const dim=new Date(viewYear,viewMonth+1,0).getDate();
  const prev=new Date(viewYear,viewMonth,0).getDate();
  const now=new Date();
  let html='';
  for(let i=start-1;i>=0;i--)html+='<div class="cal-day other">'+(prev-i)+'</div>';
  for(let d=1;d<=dim;d++){
    const k=dayKey(viewYear,viewMonth,d);
    const iT=d===now.getDate()&&viewMonth===now.getMonth()&&viewYear===now.getFullYear();
    const iS=d===selDay&&viewMonth===selMonth&&viewYear===selYear;
    const hE=events.some(e=>e.date===k);
    html+='<div class="cal-day'+(iT?' today':'')+(iS&&!iT?' selected':'')+(hE?' has-ev':'')+'" onclick="selectDay('+d+')">'+d+'</div>';
  }
  document.getElementById('cal-grid').innerHTML=html;
  renderDayEvents();
}

function selectDay(d){selDay=d;selMonth=viewMonth;selYear=viewYear;renderCal()}
function prevMonth(){viewMonth===0?(viewMonth=11,viewYear--):viewMonth--;renderCal()}
function nextMonth(){viewMonth===11?(viewMonth=0,viewYear++):viewMonth++;renderCal()}

function renderDayEvents(){
  const k=dayKey(selYear,selMonth,selDay);
  document.getElementById('sel-day-label').textContent=selDay+' '+MONTHS[selMonth];
  const evs=events.filter(e=>e.date===k);
  document.getElementById('day-events').innerHTML=evs.length
    ?'<div class="card">'+evs.map(e=>'<div class="card-row"><div class="event-left"><div class="event-dot '+e.type+'"></div><div class="event-info"><p>'+e.title+'</p><span>'+(e.time||'')+'&nbsp;·&nbsp;'+(e.type==='work'?'Arbete':e.type==='gym'?'Träning':'Personligt')+'</span></div></div><span class="del-btn" onclick="deleteEvent(\''+e.id+'\')">×</span></div>').join('')+'</div>'
    :'<div class="card"><div class="empty">Inga händelser</div></div>';
}

function addEvent(){
  const t=document.getElementById('ev-title').value.trim();
  if(!t)return;
  events.push({id:uid(),title:t,date:dayKey(selYear,selMonth,selDay),time:document.getElementById('ev-time').value,type:document.getElementById('ev-type').value});
  save('pln_events',events);
  document.getElementById('ev-title').value='';
  renderCal();renderHem();
}

function deleteEvent(id){events=events.filter(e=>e.id!==id);save('pln_events',events);renderCal();renderHem()}

function renderStocks(){
  document.getElementById('stocks-full').innerHTML=stocks.map(s=>'<div class="card-row"><div><div class="stock-name">'+s.name+'</div><div class="stock-ticker">'+s.ticker+'</div></div><div style="text-align:right"><div class="stock-price">'+s.price.toLocaleString('sv-SE')+'</div><div class="stock-change '+(s.change>=0?'up':'down')+'">'+(s.change>=0?'▲':'▼')+' '+Math.abs(s.change).toFixed(1)+'%</div></div></div>').join('');
}

function renderMail(){
  document.getElementById('mail-list').innerHTML=mails.length
    ?mails.map(m=>'<div class="mail-item"><div class="mail-meta"><span class="mail-sender">'+m.from+'</span><span class="mail-time">'+m.time+'</span></div><div class="mail-subject">'+m.subject+'</div><div class="mail-preview">'+m.preview+'</div></div>').join('')
    :'<div class="empty">Inga mail</div>';
}

function addMail(){
  const f=document.getElementById('mail-from').value.trim();
  const s=document.getElementById('mail-subject').value.trim();
  const p=document.getElementById('mail-preview').value.trim();
  if(!f||!s)return;
  mails.unshift({id:uid(),from:f,subject:s,preview:p,time:'Nu'});
  save('pln_mails',mails);
  document.getElementById('mail-from').value='';
  document.getElementById('mail-subject').value='';
  document.getElementById('mail-preview').value='';
  renderMail();
}

function renderGoals(){
  const render=(list,elId)=>{
    document.getElementById(elId).innerHTML=list.length
      ?list.map(g=>'<div class="goal-item"><div class="goal-check'+(g.done?' done':'')+'" onclick="toggleGoal(\''+g.id+'\')">'+(g.done?'✓':'')+'</div><span class="goal-text'+(g.done?' done':'\'")>'+g.title+'</span><span class="goal-badge '+g.type+'">'+(g.type==='short'?'Kort':'Lång')+'</span></div>').join('')
      :'<div class="empty">Inga mål ännu</div>';
  };
  render(goals.filter(g=>g.type==='short'),'short-goals-list');
  render(goals.filter(g=>g.type==='long'),'long-goals-list');
}

function toggleGoal(id){const g=goals.find(g=>g.id===id);if(g){g.done=!g.done;save('pln_goals',goals);renderGoals();renderHem()}}

function addGoal(){
  const t=document.getElementById('goal-title').value.trim();
  if(!t)return;
  goals.push({id:uid(),title:t,type:document.getElementById('goal-type').value,done:false});
  save('pln_goals',goals);
  document.getElementById('goal-title').value='';
  renderGoals();renderHem();
}

renderHem();
renderStocks();
</script>
</body>
</html>
